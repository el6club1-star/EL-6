<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA ELITE v6.0 - CLUB PRIVADO EL 6</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --gold: #d4af37; --bg: #ffffff; --card: #f8fafc; --text: #1e293b; --success: #22c55e; --danger: #ef4444; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        /* LOGIN */
        #pantallaLogin { position: fixed; inset: 0; background: #000; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--gold); }
        #pantallaLogin input { padding: 15px; border: 1px solid var(--gold); background: #111; color: white; border-radius: 8px; text-align: center; margin-bottom: 15px; width: 250px; font-size: 20px; }
        
        .container { max-width: 1300px; margin: auto; display: none; }
        
        /* HEADER & NAV */
        header { text-align: center; border-bottom: 2px solid var(--gold); margin-bottom: 30px; padding-bottom: 15px; position: relative; }
        .admin-only, .jefe-only { display: none; }

        /* PANEL CLAVES (ESCONDIDO) */
        #panelConfigClaves { background: #f1f5f9; border: 2px solid var(--gold); padding: 20px; border-radius: 15px; margin-bottom: 20px; display: none; }

        /* REGISTRO */
        .reg-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; background: #f8fafc; padding: 20px; border-radius: 15px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        input, select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; width: 100%; box-sizing: border-box; }
        
        /* BOTONES */
        .btn { padding: 12px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-gold { background: var(--gold); color: white; }
        .btn-black { background: #000; color: var(--gold); border: 1px solid var(--gold); }
        .btn-danger { background: var(--danger); color: white; }

        /* TABLA */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
        th { background: #f1f5f9; color: var(--gold); padding: 15px; text-align: left; font-size: 12px; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; }

        /* CÁMARA */
        #reader { width: 100%; max-width: 400px; margin: 15px auto; border: 4px solid var(--gold); border-radius: 15px; display: none; overflow: hidden; }

        /* MODAL TARJETA */
        #modalTarjeta { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; align-items: center; justify-content: center; flex-direction: column; }
        .card-vip { width: 320px; background: #000; border: 2px solid var(--gold); border-radius: 20px; padding: 25px; text-align: center; color: white; }
        #qr-space { background: white; padding: 10px; margin: 15px 0; display: inline-block; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="pantallaLogin">
        <h1 style="letter-spacing: 10px;">EL 6</h1>
        <input type="password" id="passApp" placeholder="CÓDIGO DE ACCESO">
        <button onclick="verificarAcceso()" class="btn btn-gold" style="width: 280px;">ENTRAR AL SISTEMA</button>
    </div>

    <div class="container" id="app">
        <header>
            <button onclick="location.reload()" class="btn btn-danger" style="position: absolute; right: 0; top: 0;">CERRAR SESIÓN</button>
            <h1 id="tituloBienvenida">⚜️ CLUB PRIVADO EL 6 ⚜️</h1>
            <p id="rangoUser" style="color: var(--gold); font-weight: bold; margin: 0;"></p>
        </header>

        <div id="panelConfigClaves" class="jefe-only">
            <h3>🔑 GESTIÓN DE CONTRASEÑAS</h3>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <div>
                    <label>PIN JEFE</label>
                    <input type="text" id="newPinJefe" placeholder="Nuevo PIN">
                </div>
                <div>
                    <label>PIN PUERTA</label>
                    <input type="text" id="newPinPuerta" placeholder="Nuevo PIN">
                </div>
                <div>
                    <label>PIN CAMARERO</label>
                    <input type="text" id="newPinCamarero" placeholder="Nuevo PIN">
                </div>
                <button onclick="guardarNuevosPins()" class="btn btn-gold" style="align-self: flex-end;">ACTUALIZAR CLAVES</button>
            </div>
        </div>

        <div class="reg-box admin-only">
            <input type="text" id="dni" placeholder="DNI / ID SOCIO" oninput="this.value=this.value.toUpperCase()">
            <input type="text" id="nom" placeholder="NOMBRE COMPLETO">
            <select id="cat">
                <option>Estándar</option>
                <option>Socio Plus</option>
                <option>VIP Plata</option>
                <option>VIP Gold</option>
            </select>
            <button onclick="registrarSocio()" class="btn btn-gold">REGISTRAR ENTRADA</button>
        </div>

        <div id="reader"></div>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="text" id="buscador" placeholder="🔍 BUSCAR POR DNI O NOMBRE..." onkeyup="actualizarLista()" style="flex: 2; border: 2px solid var(--gold);">
            <button onclick="toggleCamara()" id="btnCam" class="btn btn-black" style="flex: 1;">📷 ABRIR CÁMARA</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID/DNI</th>
                    <th>NOMBRE</th>
                    <th class="admin-only">ESTADO</th>
                    <th>ACCIONES</th>
                </tr>
            </thead>
            <tbody id="tablaSocios"></tbody>
        </table>
    </div>

    <div id="modalTarjeta">
        <div class="card-vip">
            <h2 style="margin: 0; font-size: 18px;">SOCIO CLUB EL 6</h2>
            <div id="qr-space"></div>
            <h3 id="m-nom" style="margin: 5px 0;"></h3>
            <p id="m-dni" style="font-size: 12px; opacity: 0.7; margin-bottom: 15px;"></p>
            
            <div style="background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px;">
                <p style="margin: 0 0 10px 0; font-size: 14px;">CONSUMICIONES</p>
                <div style="display: flex; justify-content: center; align-items: center; gap: 20px;">
                    <button onclick="updateCopa(-1)" class="btn" style="background: #444; color: white;">-</button>
                    <span id="m-copas" style="font-size: 24px; font-weight: bold;">0</span>
                    <button onclick="updateCopa(1)" class="btn" style="background: var(--gold); color: white;">+</button>
                </div>
            </div>
        </div>
        <button onclick="cerrarModal()" class="btn btn-danger" style="margin-top: 20px; width: 320px;">CERRAR VENTANA</button>
    </div>

    <script>
        // CONFIGURACIÓN SUPABASE
        const SUPABASE_URL = 'https://rmskjegarvntuqpfzfbm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_hEqxPZNGDxpNZEnz7hrymg_cL8GvwHK';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // CLAVES (Se guardan en LocalStorage para que puedas cambiarlas)
        let PINS = JSON.parse(localStorage.getItem('pins_el6')) || { jefe: "1234", puerta: "0000", camarero: "2222" };
        
        let db = [];
        let rolActual = "";
        let scanner = null;
        let socioSeleccionado = null;

        // LOGIN Y ROLES
        function verificarAcceso() {
            const pass = document.getElementById('passApp').value;
            if (pass === PINS.jefe) rolActual = "jefe";
            else if (pass === PINS.puerta) rolActual = "puerta";
            else if (pass === PINS.camarero) rolActual = "camarero";
            else { alert("CÓDIGO INCORRECTO"); return; }

            document.getElementById('pantallaLogin').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            aplicarPermisos();
            cargarDatos();
        }

        function aplicarPermisos() {
            document.getElementById('rangoUser').innerText = "RANGO: " + rolActual.toUpperCase();
            if (rolActual === "jefe") {
                document.querySelectorAll('.admin-only, .jefe-only').forEach(el => el.style.display = 'block');
                document.getElementById('newPinJefe').value = PINS.jefe;
                document.getElementById('newPinPuerta').value = PINS.puerta;
                document.getElementById('newPinCamarero').value = PINS.camarero;
            } else if (rolActual === "puerta") {
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            }
            // El camarero no activa los ".admin-only", por lo tanto no ve el registro ni el estado "dentro/fuera".
        }

        function guardarNuevosPins() {
            PINS.jefe = document.getElementById('newPinJefe').value;
            PINS.puerta = document.getElementById('newPinPuerta').value;
            PINS.camarero = document.getElementById('newPinCamarero').value;
            localStorage.setItem('pins_el6', JSON.stringify(PINS));
            alert("✅ CONTRASEÑAS ACTUALIZADAS");
        }

        // BASE DE DATOS
        async function cargarDatos() {
            const { data, error } = await _supabase.from('socios').select('*').order('created_at', { ascending: false });
            if (!error) { db = data; actualizarLista(); }
        }

        function actualizarLista() {
            const buscar = document.getElementById('buscador').value.toLowerCase();
            const filtrados = db.filter(s => s.dni.toLowerCase().includes(buscar) || s.nombre.toLowerCase().includes(buscar));
            
            const tbody = document.getElementById('tablaSocios');
            tbody.innerHTML = filtrados.map(s => `
                <tr>
                    <td><b>${s.dni}</b></td>
                    <td>${s.nombre}</td>
                    <td class="admin-only">${s.dentro ? '🟢' : '⚪'}</td>
                    <td>
                        <button onclick="verSocio('${s.dni}')" class="btn btn-black" style="padding: 5px 10px; font-size: 10px;">VER</button>
                        ${rolActual !== 'camarero' ? `<button onclick="toggleEntrada('${s.dni}')" class="btn btn-gold" style="padding: 5px 10px; font-size: 10px;">CHECK</button>` : ''}
                    </td>
                </tr>
            `).join('');
            aplicarPermisos(); // Re-aplicar para las nuevas filas
        }

        async function registrarSocio() {
            const d = document.getElementById('dni').value;
            const n = document.getElementById('nom').value;
            const c = document.getElementById('cat').value;
            if(!d || !n) return alert("FALTAN DATOS");
            
            await _supabase.from('socios').upsert([{ dni: d, nombre: n, cat: c, dentro: true, hora: new Date().toLocaleTimeString() }]);
            document.getElementById('dni').value = ""; document.getElementById('nom').value = "";
            cargarDatos();
        }

        async function toggleEntrada(dni) {
            const s = db.find(x => x.dni === dni);
            await _supabase.from('socios').update({ dentro: !s.dentro, hora: new Date().toLocaleTimeString() }).eq('dni', dni);
            cargarDatos();
        }

        // CÁMARA QR
        function toggleCamara() {
            const r = document.getElementById('reader');
            const b = document.getElementById('btnCam');
            
            if (r.style.display === 'block') {
                scanner.stop();
                r.style.display = 'none';
                b.innerText = "📷 ABRIR CÁMARA";
            } else {
                r.style.display = 'block';
                b.innerText = "❌ CERRAR CÁMARA";
                scanner = new Html5Qrcode("reader");
                scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                    document.getElementById('buscador').value = text;
                    actualizarLista();
                    const s = db.find(x => x.dni === text);
                    if(s) verSocio(text);
                    toggleCamara(); // Cerrar tras leer
                }).catch(err => alert("ERROR CÁMARA: " + err));
            }
        }

        // MODAL Y COPAS
        function verSocio(dni) {
            socioSeleccionado = db.find(x => x.dni === dni);
            document.getElementById('m-nom').innerText = socioSeleccionado.nombre;
            document.getElementById('m-dni').innerText = "ID: " + socioSeleccionado.dni;
            document.getElementById('m-copas').innerText = socioSeleccionado.consumos || 0;
            
            document.getElementById('qr-space').innerHTML = "";
            new QRious({ element: document.createElement('canvas'), value: dni, size: 180 });
            const qr = new QRious({ value: dni, size: 180 });
            const img = new Image(); img.src = qr.toDataURL();
            document.getElementById('qr-space').appendChild(img);
            
            document.getElementById('modalTarjeta').style.display = 'flex';
        }

        async function updateCopa(val) {
            let total = (socioSeleccionado.consumos || 0) + val;
            if (total < 0) total = 0;
            socioSeleccionado.consumos = total;
            document.getElementById('m-copas').innerText = total;
            await _supabase.from('socios').update({ consumos: total }).eq('dni', socioSeleccionado.dni);
        }

        function cerrarModal() {
            document.getElementById('modalTarjeta').style.display = 'none';
            cargarDatos();
        }

        setInterval(cargarDatos, 15000);
    </script>
</body>
</html>
