<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA ELITE v5.8 - CLUB PRIVADO EL 6</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #d4af37; --bg: #ffffff; --card: #f8fafc; --text: #1e293b; --success: #22c55e; --danger: #ef4444; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        #pantallaLogin { position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 99999; display: flex; justify-content: center; align-items: center; flex-direction: column; color: var(--gold); }
        #pantallaLogin input { padding: 15px; border: 1px solid var(--gold); background: #111; color: white; border-radius: 8px; text-align: center; margin-bottom: 15px; width: 250px; font-size: 20px; }
        .btn-logout { position: fixed; top: 20px; right: 20px; background: #000; color: #ef4444; border: 1px solid #ef4444; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; z-index: 10001; }
        .container { max-width: 1350px; margin: auto; background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid #e2e8f0; display:none; }
        header { text-align: center; border-bottom: 2px solid var(--gold); margin-bottom: 30px; padding-bottom: 15px; position: relative; }
        header h1 { letter-spacing: 8px; text-transform: uppercase; margin: 0; font-size: 32px; font-weight: 800; }
        .btn-excel { position: absolute; right: 0; top: 10px; background: #15803d; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; text-transform: uppercase; display:none; }
        .btn-reset-noche { position: absolute; left: 0; top: 10px; background: #dc2626; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; text-transform: uppercase; display:none; }
        .stats-container { display: none; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .stat-card { background: #000; color: white; padding: 20px; border-radius: 15px; text-align: center; border-bottom: 4px solid var(--gold); }
        .stat-card p { margin: 10px 0 0; font-size: 32px; font-weight: 900; }
        .reg-box { display: grid; grid-template-columns: 1.2fr 1.5fr 1fr 1.5fr 1fr auto; gap: 12px; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #e2e8f0; background: rgba(0,0,0,0.02); align-items: start; }
        input, select { padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; width: 100%; box-sizing: border-box; }
        .btn-add { background: var(--gold); color: white; border: none; padding: 0 25px; border-radius: 8px; cursor: pointer; font-weight: 800; height: 46px; text-transform: uppercase; }
        .search-input { border: 2px solid var(--gold) !important; font-weight: bold; width: 100%; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: var(--gold); font-size: 11px; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; }
        td { padding: 18px 15px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        .fila-vetada { background-color: #fee2e2 !important; color: #b91c1c !important; }
        .btn-acc { background: transparent; border: 1px solid currentColor; border-radius: 8px; cursor: pointer; font-weight: bold; color: inherit; font-size: 11px; margin-right: 8px; text-transform: uppercase; padding: 6px 10px; }
        
        /* MODAL TARJETA */
        #modalTarjeta { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 5000; justify-content: center; align-items: center; flex-direction: column; overflow-y: auto; padding: 20px 0; }
        .card-vip { width: 320px; background: #000; border: 2px solid var(--gold); border-radius: 20px; padding: 25px; text-align: center; color: white; position: relative; overflow: hidden; min-height: 400px; }
        #selloPagado { display: none; position: absolute; top: 15px; right: -30px; background: var(--success); color: white; padding: 5px 40px; transform: rotate(45deg); font-size: 10px; font-weight: bold; z-index: 10; }
        #qr-space { background: white; padding: 10px; margin: 15px 0; display: inline-block; border-radius: 10px; min-height: 140px; }
        .box-consumiciones { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 10px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .btn-cant { background: var(--gold); color: black; border: none; width: 35px; height: 35px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 20px; }
        .card-actions { display: flex; gap: 10px; margin-top: 15px; width: 320px; }
        .btn-card { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 10px; text-transform: uppercase; }
        .btn-pay { background: var(--success); color: white; }
        .btn-send { background: var(--gold); color: black; }
        
        #box-firma { display: none; background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 500px; color: #000; z-index: 6000; }
        canvas#canvasFirma { border: 1px dashed #000; background: #fff; width: 100%; height: 120px; touch-action: none; }
        .admin-btns { display: flex; gap: 5px; position: absolute; right: 0; top: 50px; }
        .contenedor-rgpd { display: flex; align-items: center; gap: 5px; margin-top: 5px; font-size: 9px; }
    </style>
</head>
<body>

    <div id="pantallaLogin">
        <h1 style="letter-spacing: 10px;">EL 6</h1>
        <input type="password" id="passApp" placeholder="CÓDIGO">
        <button onclick="validarEntrada()" style="background:var(--gold); border:none; padding:12px 50px; border-radius:8px; cursor:pointer; font-weight:bold; color:white;">ACCEDER</button>
    </div>

    <button class="btn-logout" id="btnLogout" style="display:none;" onclick="cerrarSesion()">CERRAR SESIÓN 🚪</button>

    <div class="container" id="principal">
        <header>
            <button class="btn-reset-noche" id="btnReset" onclick="resetJornada()">🔄 REINICIAR NOCHE</button>
            <div class="admin-btns" id="adminExtra" style="display:none;">
                <button onclick="exportarBaseDatos()" style="background:#3b82f6; color:white; border:none; padding:5px 10px; border-radius:5px; font-size:10px; cursor:pointer;">💾 COPIA</button>
                <button onclick="document.getElementById('importFile').click()" style="background:#8b5cf6; color:white; border:none; padding:5px 10px; border-radius:5px; font-size:10px; cursor:pointer;">📥 IMPORTAR</button>
                <input type="file" id="importFile" style="display:none" onchange="importarBaseDatos(event)">
            </div>
            <button class="btn-excel" id="btnExport" onclick="exportarExcel()">📊 EXCEL</button>
            <h1>⚜️ CLUB PRIVADO EL 6 ⚜️</h1>
        </header>

        <div id="panelAdmin" class="stats-container">
            <div class="stat-card"><h3>TOTAL SOCIOS</h3><p id="st-total">0</p></div>
            <div class="stat-card"><h3>AFORO ACTUAL</h3><p id="st-aforo">0</p></div>
            <div class="stat-card"><h3>VETADOS</h3><p id="st-vetados" style="color:var(--danger);">0</p></div>
        </div>

        <div class="reg-box">
            <div>
                <label style="font-size:11px; font-weight:bold;">ID / DNI</label>
                <input type="text" id="dni" placeholder="PASE LECTOR" oninput="this.value = this.value.toUpperCase(); autocompletarSocio();">
                <div class="contenedor-rgpd">
                    <input type="checkbox" id="checkRGPD"> <span>Acepto <a onclick="gestionarEstatutos()">Estatutos/RGPD</a></span>
                </div>
            </div>
            <div><label style="font-size:11px; font-weight:bold;">NOMBRE</label><input type="text" id="nom" placeholder="NOMBRE"></div>
            <div><label style="font-size:11px; font-weight:bold;">CUMPLE</label><input type="date" id="cumple"></div>
            <div><label style="font-size:11px; font-weight:bold;">EMAIL</label><input type="email" id="mail" placeholder="EMAIL"></div>
            <div><label style="font-size:11px; font-weight:bold;">TIPO</label>
                <select id="cat">
                    <option>Estándar</option><option>Socio Plus</option><option>VIP Plata</option><option>VIP Gold</option><option>Elite</option>
                </select>
            </div>
            <div style="padding-top:23px;"><button class="btn-add" onclick="registrar()">REGISTRAR</button></div>
        </div>

        <input type="text" id="buscador" class="search-input" placeholder="🔍 BUSCAR SOCIO..." onkeyup="render()">

        <table>
            <thead><tr><th>Nº SOCIO</th><th>ID</th><th>NOMBRE</th><th>CATEGORÍA</th><th>ESTADO</th><th>HORA</th><th>ACCIONES</th></tr></thead>
            <tbody id="lista"></tbody>
        </table>
    </div>

    <div id="modalTarjeta">
        <div class="card-vip" id="cardMain">
            <div id="selloPagado">PAGADO ✅</div>
            <h2 style="font-size:16px; margin:0;">CLUB PRIVADO EL 6</h2>
            <div id="card-id" style="font-size:32px; font-weight:900; margin:5px 0;">Nº --</div>
            <div id="qr-space"></div>
            <div class="box-consumiciones">
                <button class="btn-cant" onclick="modificarConsumos(-1)">-</button>
                <div style="font-size:11px;">CONSUMICIONES: <span id="card-consumos" style="font-weight:bold; font-size:22px;">0</span></div>
                <button class="btn-cant" onclick="modificarConsumos(1)">+</button>
            </div>
            <div style="text-align:left; font-size:11px; border-top:1px solid rgba(255,255,255,0.2); padding-top:10px;">
                <p>SOCIO: <span id="card-nom" style="float:right; font-weight:bold;">---</span></p>
                <p>DNI: <span id="card-dni" style="float:right;">---</span></p>
            </div>
        </div>
        <div class="card-actions" id="accionesTarjeta">
            <button class="btn-card btn-pay" onclick="marcarPago()">PAGAR / DESPARECER SELLO</button>
            <button class="btn-card btn-send" onclick="descargarTarjeta()">DESCARGAR PNG</button>
        </div>
        <button style="margin-top: 20px; padding: 10px 50px; cursor: pointer; font-weight:bold;" onclick="cerrar()">CERRAR</button>
    </div>

    <script>
        const supabaseUrl = 'https://rmskjegarvntuqpfzfbm.supabase.co';
        const supabaseKey = 'sb_publishable_hEqxPZNGDxpNZEnz7hrymg_cL8GvwHK';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
        const NOMBRE_TABLA = 'socios';

        let db = []; let socioActual = null; let nivel = "personal";

        async function refrescarDatos() {
            const { data, error } = await _supabase.from(NOMBRE_TABLA).select('*').order('created_at', { ascending: false });
            if(!error) { db = data; render(); }
        }

        function validarEntrada() {
            const p = document.getElementById('passApp').value;
            if(p === "1234") { nivel="jefe"; entrar(); } 
            else if(p === "0000") { nivel="personal"; entrar(); } 
            else alert("ERROR");
        }

        async function entrar() { 
            document.getElementById('pantallaLogin').style.display='none'; 
            document.getElementById('principal').style.display='block'; 
            document.getElementById('btnLogout').style.display='block'; 
            if(nivel === 'jefe') {
                document.getElementById('btnExport').style.display='block'; 
                document.getElementById('btnReset').style.display='block'; 
                document.getElementById('panelAdmin').style.display='grid'; 
                document.getElementById('adminExtra').style.display='flex';
            }
            await refrescarDatos(); 
        }

        function autocompletarSocio() {
            const d = document.getElementById('dni').value.trim();
            const s = db.find(x => x.dni === d);
            if(s) {
                document.getElementById('nom').value = s.nombre || "";
                document.getElementById('mail').value = s.email || "";
                document.getElementById('cat').value = s.cat || "Estándar";
                document.getElementById('cumple').value = s.cumple || "";
                document.getElementById('checkRGPD').checked = true;
            }
        }

        async function registrar() {
            const d = document.getElementById('dni').value.toUpperCase();
            const n = document.getElementById('nom').value;
            if(!d || !n) { alert("RELLENA DNI Y NOMBRE"); return; }
            if(!document.getElementById('checkRGPD').checked) { alert("ACEPTA RGPD"); return; }

            const datos = { 
                dni: d, nombre: n, 
                cumple: document.getElementById('cumple').value, 
                email: document.getElementById('mail').value, 
                cat: document.getElementById('cat').value,
                dentro: true, hora: new Date().toLocaleTimeString()
            };

            const { data, error } = await _supabase.from(NOMBRE_TABLA).upsert([datos], { onConflict: 'dni' }).select();
            
            if(!error && data) {
                await refrescarDatos();
                abrirTarjeta(data[0]); // <--- ESTO HACE QUE SALTE LA TARJETA
                document.getElementById('dni').value=""; document.getElementById('nom').value="";
            } else { alert("ERROR AL GUARDAR"); }
        }

        function abrirTarjeta(s) {
            socioActual = s;
            document.getElementById('card-id').innerText = "Nº " + (s.id || "--");
            document.getElementById('card-nom').innerText = s.nombre;
            document.getElementById('card-dni').innerText = s.dni;
            document.getElementById('card-consumos').innerText = s.consumiciones || 0;
            document.getElementById('selloPagado').style.display = s.pagado ? 'block' : 'none';
            
            const cat = s.cat || "Estándar";
            const card = document.getElementById('cardMain');
            if(cat === "VIP Gold") card.style.background = "linear-gradient(135deg, #d4af37, #f9f295)";
            else if(cat === "VIP Plata") card.style.background = "linear-gradient(135deg, #a0a0a0, #e0e0e0)";
            else if(cat === "Elite") card.style.background = "linear-gradient(135deg, #0f172a, #1e40af)";
            else card.style.background = "#000";

            document.getElementById('qr-space').innerHTML = "";
            const qr = new QRious({ value: s.dni, size: 200 });
            const img = new Image(); img.src = qr.toDataURL(); img.style.width="140px";
            document.getElementById('qr-space').appendChild(img);
            
            document.getElementById('modalTarjeta').style.display = 'flex';
        }

        async function modificarConsumos(v) {
            if(!socioActual) return;
            const n = (socioActual.consumiciones || 0) + v;
            if(n < 0) return;
            const { error } = await _supabase.from(NOMBRE_TABLA).update({ consumiciones: n }).eq('dni', socioActual.dni);
            if(!error) {
                socioActual.consumiciones = n;
                document.getElementById('card-consumos').innerText = n;
                refrescarDatos();
            }
        }

        async function marcarPago() {
            const estado = !socioActual.pagado;
            await _supabase.from(NOMBRE_TABLA).update({ pagado: estado }).eq('dni', socioActual.dni);
            socioActual.pagado = estado;
            document.getElementById('selloPagado').style.display = estado ? 'block' : 'none';
            refrescarDatos();
        }

        function render() {
            const b = document.getElementById('buscador').value.toLowerCase();
            const f = db.filter(x => x.nombre.toLowerCase().includes(b) || x.dni.includes(b.toUpperCase()));
            document.getElementById('st-total').innerText = db.length;
            document.getElementById('st-aforo').innerText = db.filter(x=>x.dentro).length;
            document.getElementById('lista').innerHTML = f.map(s => `
                <tr>
                    <td>${s.id}</td><td>${s.dni}</td><td>${s.nombre}</td><td>${s.cat}</td>
                    <td>${s.dentro ? '🟢' : '⚪'}</td><td>${s.hora || '-'}</td>
                    <td>
                        <button class="btn-acc" onclick="reAbrir('${s.dni}')">VER TARJETA</button>
                    </td>
                </tr>`).join('');
        }

        function reAbrir(dni) { abrirTarjeta(db.find(x=>x.dni===dni)); }
        function cerrar() { document.getElementById('modalTarjeta').style.display='none'; }
        async function descargarTarjeta() { const can = await html2canvas(document.getElementById('cardMain')); const a = document.createElement('a'); a.download = 'tarjeta.png'; a.href = can.toDataURL(); a.click(); }
        function cerrarSesion() { location.reload(); }
    </script>
</body>
</html>
