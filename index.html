<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión Club - Panel Completo</title>
</head>
<body>

    <!-- Contenedores principales esperados por el script -->
    <div id="card-consumos"></div>
    <div id="modalTarjeta" style="display:none;">
        <div id="cardMain"></div>
        <div id="box-firma" style="display:none;">
            <canvas id="signatureCanvas" width="300" height="150" style="border:1px solid #d4af37;"></canvas>
            <button type="button" onclick="guardarFirmaSocio()">Guardar Firma</button>
        </div>
        <div id="qr-space"></div>
        <button id="btnLogout" type="button">Cerrar Sesión</button>
    </div>
    <div id="modalLibroCajas" style="display:none;">
        <div id="cajaDesgloseContenido"></div>
        <input type="number" id="cajaTpvInput" oninput="calcularDescuadreEnTiempoReal()">
        <input type="number" id="cajaEfectivoInput" oninput="calcularDescuadreEnTiempoReal()">
        <div id="cajaResultadoCéntimo"></div>
        <button type="button" onclick="ejecutarCierreResetFinal()">Ejecutar Cierre y Reset</button>
    </div>
    <select id="tipoClave">
        <option value="puerta">Puerta</option>
        <option value="camarero">Camarero</option>
        <option value="jefe">Jefe</option>
    </select>
    <input type="text" id="nuevaClaveInput">

    <script>
    // Variables globales de entorno y simulación de base de datos
    let db = [];
    let socioActual = null;
    let productosValidos = ["COPA", "CERVEZA", "REFRESCO", "AGUA", "ENERGÉTICO", "CHUPITO"];
    let consumosSocio = {};
    let firmaCargadaCache = "";
    let origenFirma = "";
    let datosCajaGlobal = {};
    let CLAVES = { puerta: "1234", camarero: "5678", jefe: "9999" };
    const NOMBRE_TABLA = "socios_club";
    
    // Simulación de Supabase y Canvas si no están definidos
    const canvas = document.getElementById('signatureCanvas');
    const ctx = canvas ? canvas.getContext('2d') : null;
    let dibujando = false;

    window._supabase = window._supabase || {
        from: (tabla) => ({
            update: () => ({ eq: async () => ({ error: null }), in: async () => ({ error: null }) }),
            select: () => ({ order: async () => ({ data: [], error: null }) }),
            insert: async () => ({ error: null }),
            delete: () => ({ eq: async () => ({ error: null }) })
        })
    };

    function refrescarDatos() {
        // Función de recarga de datos de la app
    }

    let htmlConsumos = `
        <div style="margin: 5px auto; width: 100%; max-width: 240px; font-family: 'Inter', sans-serif;">
            <button type="button" onclick="abrirBurbujaFlotante()" style="width: 100%; background: rgba(0,0,0,0.6); color: #d4af37; border: 1px solid #d4af37; border-radius: 8px; padding: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
                ⚡ GESTIONAR CONSUMICIONES ▾
            </button>
        </div>
    `;

    if(document.getElementById('card-consumos')) {
        document.getElementById('card-consumos').innerHTML = htmlConsumos;
    }

    let burbujaExterna = document.getElementById('ventanilla-consumos');
    if (!burbujaExterna && document.getElementById('modalTarjeta')) {
        burbujaExterna = document.createElement('div');
        burbujaExterna.id = 'ventanilla-consumos';
        burbujaExterna.style.cssText = "display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 240px; background: #141414; border: 2px solid #d4af37; border-radius: 14px; box-shadow: 0 15px 40px rgba(0,0,0,0.95); z-index: 100001; padding: 14px; box-sizing: border-box; font-family: 'Inter', sans-serif;";
        document.getElementById('modalTarjeta').appendChild(burbujaExterna);
    }

    function abrirBurbujaFlotante() {
        const ventanilla = document.getElementById('ventanilla-consumos');
        if (ventanilla) {
            ventanilla.style.display = 'block';
        }
    }

    async function modificarCantidadDirecta(dni, producto, cambio) {
        const prodKey = producto.toUpperCase();

        let socioActivo = null;
        if (typeof db !== 'undefined') socioActivo = db.find(x => x.dni === dni);
        if (!socioActivo) socioActivo = socioActual;

        let consumos = {};
        productosValidos.forEach(p => consumos[p] = 0);

        const stringOriginal = String(socioActivo ? socioActivo.consumiciones : '').trim();
        if (stringOriginal.includes(':')) {
            stringOriginal.split(',').forEach(item => {
                const [p, c] = item.split(':');
                if(p && productosValidos.includes(p.trim().toUpperCase())) consumos[p.trim().toUpperCase()] = parseInt(c) || 0;
            });
        }

        let cantActual = consumos[prodKey] || 0;
        let nuevaCant = cantActual + cambio;
        if (nuevaCant < 0) nuevaCant = 0;
        consumos[prodKey] = nuevaCant;

        const elementoContador = document.getElementById(`v-cant-${producto}`);
        if (elementoContador) {
            elementoContador.innerText = nuevaCant;
            elementoContador.style.color = nuevaCant > 0 ? '#d4af37' : '#fff';
        }

        let resultadoString = Object.keys(consumos)
            .filter(p => consumos[p] > 0)
            .map(p => `${p}:${consumos[p]}`)
            .join(','); 

        await _supabase.from(NOMBRE_TABLA).update({ consumiciones: resultadoString }).eq('dni', dni);

        if (typeof db !== 'undefined') {
            let idx = db.findIndex(x => x.dni === dni);
            if (idx !== -1) db[idx].consumiciones = resultadoString;
        }
        if (socioActual && socioActual.dni === dni) {
            socioActual.consumiciones = resultadoString;
        }
    }

    async function descargarTarjeta() { 
        if (!socioActual || !socioActual.dni) {
            alert("⚠️ No hay ningún socio seleccionado para enviar la tarjeta.");
            return;
        }

        if (!socioActual.email) {
            alert("⚠️ Este socio no tiene un correo electrónico registrado en la base de datos.");
            return;
        }

        const confirmar = confirm(`¿Quieres enviar/reenviar la tarjeta digital al correo: ${socioActual.email}?`);
        if (!confirmar) return;

        try {
            await _supabase
                .from(NOMBRE_TABLA)
                .update({ reenviar_tarjeta: true })
                .eq('dni', socioActual.dni);

            alert(`✉️ Petición enviada con éxito. La tarjeta va en camino a: ${socioActual.email}`);

            setTimeout(async () => {
                await _supabase
                    .from(NOMBRE_TABLA)
                    .update({ reenviar_tarjeta: false })
                    .eq('dni', socioActual.dni);
            }, 3000);

        } catch (error) {
            console.error(error);
            alert("❌ Hubo un error al intentar comunicar con Supabase.");
        }
    }

    function reAbrir(dni) { 
        const socio = db.find(x => x.dni === dni);
        if (socio) abrirTarjeta(socio); 
    }

    function cerrar() { 
        document.getElementById('modalTarjeta').style.display = 'none'; 
        const ventanilla = document.getElementById('ventanilla-consumos');
        if (ventanilla) ventanilla.style.display = 'none';
        if (canvas && ctx) {
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
        }
        if (typeof render === 'function') render();
    }

    function cerrarSesion() { location.reload(); }

    function gestionarEstatutos(origen) { 
        origenFirma = origen;
        document.getElementById('modalTarjeta').style.display = 'flex'; 
        document.getElementById('box-firma').style.display = 'block'; 
        document.getElementById('cardMain').style.display = 'none'; 

        if (canvas && ctx) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();

            const btnAceptarFirma = document.querySelector('#box-firma button[onclick="guardarFirmaSocio()"]');
            const firmaDisponible = (socioActual && socioActual.firma_b64) ? socioActual.firma_b64 : firmaCargadaCache;

            if (firmaDisponible) {
                const imgFirma = new Image();
                imgFirma.onload = function() {
                    ctx.drawImage(imgFirma, 0, 0, canvas.width, canvas.height);
                };
                imgFirma.src = firmaDisponible;

                if (btnAceptarFirma) btnAceptarFirma.style.display = 'none';
            } else {
                if (btnAceptarFirma) btnAceptarFirma.style.display = 'block';
            }
        }
    }

    function cerrarFirma() { 
        document.getElementById('box-firma').style.display = 'none'; 
        if(origenFirma === 'tarjeta') {
            document.getElementById('cardMain').style.display = 'block'; 
        } else {
            document.getElementById('modalTarjeta').style.display = 'none';
        }
        if (canvas && ctx) {
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            ctx.beginPath();
        }
    }

    async function guardarFirmaSocio() { 
        const firmaB64 = canvas.toDataURL();
        firmaCargadaCache = firmaB64;

        if(origenFirma === 'tarjeta' && socioActual) {
            await _supabase.from(NOMBRE_TABLA).update({ firma_b64: firmaB64 }).eq('dni', socioActual.dni);
            socioActual.firma_b64 = firmaB64;
            
            if (typeof db !== 'undefined') {
                let idx = db.findIndex(x => x.dni === socioActual.dni);
                if (idx !== -1) db[idx].firma_b64 = firmaB64;
            }

            if(typeof refrescarDatos === 'function') await refrescarDatos();
            
            alert("Firmado y aceptado: Estatutos, Privacidad y RGPD"); 
            cerrarFirma(); 
        } else {
            socioActual = socioActual || {};
            socioActual.firma_b64 = firmaB64;
            const check = document.getElementById('checkRGPD');
            if (check) check.checked = true; 
            alert("Estatutos aceptados para el nuevo registro.");
            cerrarFirma();
        }
    }

    function actualizarClave() {
        const t = document.getElementById('tipoClave').value; 
        const n = document.getElementById('nuevaClaveInput').value;
        if(n) { CLAVES[t] = n; localStorage.setItem('claves_el6', JSON.stringify(CLAVES)); alert("Actualizado"); }
    }

    /* --- MOTOR NUEVO LÓGICA DEL LIBRO DE CAJAS --- */
    function prepararCierreCaja() { 
        const PRECIO_ENTRADA = 20;
        const PRECIO_COPA = 10;
        const PRECIO_CERVEZA = 5;
        const PRECIO_REFRESCO = 5;
        const PRECIO_AGUA = 5;
        const PRECIO_ENERGETICO = 5;
        const PRECIO_CHUPITO = 5;

        let totalAsistentes = 0;
        let totalCopas = 0;
        let totalCervezas = 0;
        let totalRefrescos = 0;
        let totalAguas = 0;
        let totalEnergeticos = 0;
        let totalChupitos = 0;
        let recaudacionEsperada = 0;

        db.forEach(s => {
            if (s.dentro || s.hora) {
                totalAsistentes++;
                recaudacionEsperada += PRECIO_ENTRADA;

                let consumosMap = { COPA: 0, CERVEZA: 0, REFRESCO: 0, AGUA: 0, ENERGÉTICO: 0, CHUPITO: 0 };
                const stringConsumos = String(s.consumiciones || '').trim();
                if (stringConsumos.includes(':')) {
                    stringConsumos.split(',').forEach(item => {
                        const [p, c] = item.split(':');
                        if (p && typeof consumosMap[p.trim().toUpperCase()] !== 'undefined') {
                            consumosMap[p.trim().toUpperCase()] = parseInt(c) || 0;
                        }
                    });
                }

                totalCopas += consumosMap['COPA'];
                totalCervezas += consumosMap['CERVEZA'];
                totalRefrescos += consumosMap['REFRESCO'];
                totalAguas += consumosMap['AGUA'];
                totalEnergeticos += consumosMap['ENERGÉTICO'];
                totalChupitos += consumosMap['CHUPITO'];

                recaudacionEsperada += (consumosMap['COPA'] * PRECIO_COPA);
                recaudacionEsperada += (consumosMap['CERVEZA'] * PRECIO_CERVEZA);
                recaudacionEsperada += (consumosMap['REFRESCO'] * PRECIO_REFRESCO);
                recaudacionEsperada += (consumosMap['AGUA'] * PRECIO_AGUA);
                recaudacionEsperada += (consumosMap['ENERGÉTICO'] * PRECIO_ENERGETICO);
                recaudacionEsperada += (consumosMap['CHUPITO'] * PRECIO_CHUPITO);
            }
        });

        datosCajaGlobal = {
            totalAsistentes, recaudacionEsperada,
            totalCopas, totalCervezas, totalRefrescos, totalAguas, totalEnergeticos, totalChupitos,
            dineroEntradas: totalAsistentes * PRECIO_ENTRADA,
            dineroCopas: totalCopas * PRECIO_COPA,
            dineroCervezas: totalCervezas * PRECIO_CERVEZA,
            dineroRefrescos: totalRefrescos * PRECIO_REFRESCO,
            dineroAguas: totalAguas * PRECIO_AGUA,
            dineroEnergeticos: totalEnergeticos * PRECIO_ENERGETICO,
            dineroChupitos: totalChupitos * PRECIO_CHUPITO
        };

        let htmlHTML = `
            <div class="item-desglose" style="font-weight:bold; border-bottom:1px solid #d4af37; padding-bottom:4px;"><span>CONCEPTO</span><span>CANT x PRECIO = TOTAL</span></div>
            <div class="item-desglose"><span>🎫 ENTRADAS</span><span>${totalAsistentes} x 20€ = <strong>${datosCajaGlobal.dineroEntradas}€</strong></span></div>
            <div class="item-desglose"><span>🍹 COPAS</span><span>${totalCopas} x 10€ = <strong>${datosCajaGlobal.dineroCopas}€</strong></span></div>
            <div class="item-desglose"><span>🍺 CERVEZAS</span><span>${totalCervezas} x 5€ = <strong>${datosCajaGlobal.dineroCervezas}€</strong></span></div>
            <div class="item-desglose"><span>🥤 REFRESCOS</span><span>${totalRefrescos} x 5€ = <strong>${datosCajaGlobal.dineroRefrescos}€</strong></span></div>
            <div class="item-desglose"><span>💧 AGUAS</span><span>${totalAguas} x 5€ = <strong>${datosCajaGlobal.dineroAguas}€</strong></span></div>
            <div class="item-desglose"><span>⚡ ENERGÉTICOS</span><span>${totalEnergeticos} x 5€ = <strong>${datosCajaGlobal.dineroEnergeticos}€</strong></span></div>
            <div class="item-desglose"><span>🥃 CHUPITOS</span><span>${totalChupitos} x 5€ = <strong>${datosCajaGlobal.dineroChupitos}€</strong></span></div>
            <div class="item-desglose" style="border-top:1px dashed #d4af37; margin-top:8px; font-size:15px; color:#d4af37; font-weight:900;"><span>💰 RECAUDACIÓN TOTAL ESPERADA</span><span>${recaudacionEsperada}€</span></div>
        `;

        document.getElementById('cajaDesgloseContenido').innerHTML = htmlHTML;
        document.getElementById('cajaTpvInput').value = 0;
        document.getElementById('cajaEfectivoInput').value = 0;
        
        calcularDescuadreEnTiempoReal();
        document.getElementById('modalLibroCajas').style.display = 'flex';
    }

    function calcularDescuadreEnTiempoReal() {
        const tpv = parseFloat(document.getElementById('cajaTpvInput').value) || 0;
        const efectivo = parseFloat(document.getElementById('cajaEfectivoInput').value) || 0;
        const totalReal = tpv + efectivo;
        const descuadre = totalReal - datosCajaGlobal.recaudacionEsperada;

        const indicador = document.getElementById('cajaResultadoCéntimo');
        if (indicador) {
            if (descuadre === 0) {
                indicador.innerText = "✅ ¡Caja cuadrada al céntimo! (0.00€)";
                indicador.style.background = "rgba(34,197,94,0.2)";
                indicador.style.color = "#22c55e";
            } else if (descuadre > 0) {
                indicador.innerText = `🟢 ¡Sobra dinero! Beneficio extra: +${descuadre.toFixed(2)}€`;
                indicador.style.background = "rgba(34,197,94,0.2)";
                indicador.style.color = "#22c55e";
            } else {
                indicador.innerText = `🔴 ¡FALTA DINERO! Descuadre de: ${descuadre.toFixed(2)}€`;
                indicador.style.background = "rgba(239,68,68,0.2)";
                indicador.style.color = "#ef4444";
            }
        }
    }

    async function ejecutarCierreResetFinal() {
        if(!confirm("¿Estás completamente seguro de que deseas cerrar la noche? Se guardará en el histórico y se limpiarán los aforos y consumiciones.")) return;

        const totalTPV = parseFloat(document.getElementById('cajaTpvInput').value) || 0;
        const totalEfectivo = parseFloat(document.getElementById('cajaEfectivoInput').value) || 0;
        const totalCajaReal = totalTPV + totalEfectivo;
        const descuadre = totalCajaReal - datosCajaGlobal.recaudacionEsperada;

        const { error: errorCaja } = await _supabase
            .from('cajas_diarias')
            .insert([{ 
                fecha: new Date().toISOString().split('T')[0],
                total_asistentes: datosCajaGlobal.totalAsistentes, 
                recaudacion_esperada: datosCajaGlobal.recaudacionEsperada,
                pagado_efectivo: totalEfectivo,
                pagado_tpv: totalTPV,
                descuadre: descuadre,
                copas_vendidas: datosCajaGlobal.totalCopas,
                cervezas_vendidas: datosCajaGlobal.totalCervezas,
                refrescos_vendidas: datosCajaGlobal.totalRefrescos,
                aguas_vendidas: datosCajaGlobal.totalAguas,
                energeticos_vendidas: datosCajaGlobal.totalEnergeticos,
                chupitos_vendidas: datosCajaGlobal.totalChupitos
            }]);

        if (errorCaja) {
            console.error("Error al guardar arqueo en Supabase:", errorCaja.message);
            alert("⚠️ Error crítico: No se pudo guardar el arqueo en 'cajas_diarias'. Revisa la consola.");
            return;
        }

        const listaIds = db.map(socio => socio.id).filter(id => id != null);
        
        if (listaIds.length > 0) {
            const { error: errorSocios } = await _supabase
                .from(NOMBRE_TABLA)
                .update({ 
                    dentro: false, 
                    hora: null, 
                    consumiciones: null, 
                    pago_realizado: false,
                    hora_pago: null
                })
                .in('id', listaIds);

            if (errorSocios) {
                console.error("Error al resetear socios:", errorSocios.message);
                alert("⚠️ Error parcial: Se guardó el arqueo pero falló la limpieza de socios: " + errorSocios.message);
                return;
            }
        }

        productosValidos.forEach(prod => {
            const el = document.getElementById(`v-cant-${prod}`);
            if (el) el.innerText = "0";
        });

        socioActual = null;
        if (document.getElementById('modalTarjeta')) {
            document.getElementById('modalTarjeta').style.display = 'none';
        }
        document.getElementById('modalLibroCajas').style.display = 'none';

        if (typeof refrescarDatos === 'function') await refrescarDatos(); 
        alert("💾 ¡Noche cerrada con éxito! Registrada en el histórico en la nube.");
    }

    /* --- INYECTOR DEL BOTÓN DE HISTÓRICO PROTEGIDO --- */
    function inyectorBotonHistorialEnArqueo() {
        const contenedorModal = document.getElementById('modalLibroCajas');
        if (!contenedorModal) return;

        if (document.getElementById('btn-historial-seguro')) return;

        const btnConfirmar = contenedorModal.querySelector("button[onclick*='ejecutarCierreResetFinal']");
        if (btnConfirmar) {
            const btnHist = document.createElement('button');
            btnHist.id = 'btn-historial-seguro';
            btnHist.type = 'button';
            btnHist.onclick = mostrarHistoricoCajas;
            btnHist.innerText = "📊 VER LIBRO HISTÓRICO";
            btnHist.style.cssText = "background: rgba(0,0,0,0.6); color: #d4af37; border: 1px solid #d4af37; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer; margin-top: 15px; width: 100%; display: block; text-align: center; letter-spacing: 0.5px; transition: 0.2s;";
            
            btnHist.onmouseover = () => { btnHist.style.background = '#d4af37'; btnHist.style.color = '#000'; };
            btnHist.onmouseout = () => { btnHist.style.background = 'rgba(0,0,0,0.6)'; btnHist.style.color = '#d4af37'; };

            btnConfirmar.parentNode.insertBefore(btnHist, btnConfirmar.nextSibling);
        }
    }

    /* --- PANTALLA VISUAL: LIBRO HISTÓRICO CON COLUMNA ACCIONES --- */
    async function mostrarHistoricoCajas() {
        const viejo = document.getElementById('modalHistoricoCajas');
        if(viejo) viejo.remove();

        const { data: registros, error } = await _supabase
            .from('cajas_diarias')
            .select('*')
            .order('fecha', { ascending: false });

        if(error) {
            alert("Error al cargar el histórico: " + error.message);
            return;
        }

        const modalHist = document.createElement('div');
        modalHist.id = 'modalHistoricoCajas';
        modalHist.style.cssText = "display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200000; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; color: #fff; box-sizing: border-box; padding: 20px;";

        let tablaHTML = `
            <div style="background: #111; border: 2px solid #d4af37; border-radius: 16px; width: 100%; max-width: 1150px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); position: relative; max-height: 85vh; display: flex; flex-direction: column;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px;">
                    <h2 style="margin: 0; font-size: 18px; color: #d4af37; font-weight: 800; letter-spacing: 0.5px;">📊 LIBRO HISTÓRICO DE CAJAS UNIFICADO</h2>
                    <div style="display: flex; gap: 12px; align-items: center;">
                        <button onclick="descargarExcelUnificado()" style="background: #d4af37; color: #000; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer;">📥 DESCARGAR LIBRO EXCEL (.CSV)</button>
                        <button onclick="document.getElementById('modalHistoricoCajas').remove()" style="background: none; border: none; color: #ff4a4a; font-size: 22px; font-weight: bold; cursor: pointer;">✕</button>
                    </div>
                </div>
                
                <div style="overflow-x: auto; flex: 1; border-radius: 8px; background: rgba(255,255,255,0.02);">
                    <table style="width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; min-width: 1000px;">
                        <thead>
                            <tr style="background: rgba(212, 175, 55, 0.1); border-bottom: 2px solid #d4af37; color: #d4af37; font-weight: 700;">
                                <th style="padding: 12px 10px;">FECHA</th>
                                <th style="padding: 12px 10px; text-align:center;">ENTRADAS</th>
                                <th style="padding: 12px 10px; text-align:center;">COPAS</th>
                                <th style="padding: 12px 10px; text-align:center;">CERVEZAS</th>
                                <th style="padding: 12px 10px; text-align:center;">CHUPITOS</th>
                                <th style="padding: 12px 10px; text-align:center;">REFRESCOS</th>
                                <th style="padding: 12px 10px; text-align:center;">ENERGÉTICOS</th>
                                <th style="padding: 12px 10px; text-align:right; background: rgba(255,255,255,0.03);">TOTAL CAJA</th>
                                <th style="padding: 12px 10px; text-align:right;">COBRADO TPV</th>
                                <th style="padding: 12px 10px; text-align:right;">EFECTIVO</th>
                                <th style="padding: 12px 10px; text-align:center; color: #fff;">ESTADO CAJA</th>
                                <th style="padding: 12px 10px; text-align:center; color: #ff4a4a; background: rgba(239,68,68,0.05);">ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody>
        `;

        if (registros) {
            registros.forEach(r => {
                const totalCajaCalculado = (parseFloat(r.pagado_efectivo) || 0) + (parseFloat(r.pagado_tpv) || 0);
                const desc = parseFloat(r.descuadre) || 0;
                let estadoBadge = "";
                
                if(desc === 0) {
                    estadoBadge = `<span style="background: rgba(34,197,94,0.15); color: #22c55e; padding: 3px 8px; border-radius: 4px; font-weight:700;">Cuadrada</span>`;
                } else if(desc > 0) {
                    estadoBadge = `<span style="background: rgba(34,197,94,0.15); color: #22c55e; padding: 3px 8px; border-radius: 4px; font-weight:700;">Sobran +${desc.toFixed(2)}€</span>`;
                } else {
                    estadoBadge = `<span style="background: rgba(239,68,68,0.15); color: #ef4444; padding: 3px 8px; border-radius: 4px; font-weight:700;">Faltan ${desc.toFixed(2)}€</span>`;
                }

                let fInvertida = r.fecha;
                if(r.fecha && r.fecha.includes('-')) {
                    fInvertida = r.fecha.split('-').reverse().join('/');
                }

                tablaHTML += `
                    <tr id="fila-caja-${r.id}" style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                        <td style="padding: 10px;">${fInvertida}</td>
                        <td style="padding: 10px; text-align:center;">${r.total_asistentes || 0}</td>
                        <td style="padding: 10px; text-align:center;">${r.copas_vendidas || 0}</td>
                        <td style="padding: 10px; text-align:center;">${r.cervezas_vendidas || 0}</td>
                        <td style="padding: 10px; text-align:center;">${r.chupitos_vendidas || 0}</td>
                        <td style="padding: 10px; text-align:center;">${r.refrescos_vendidas || 0}</td>
                        <td style="padding: 10px; text-align:center;">${r.energeticos_vendidas || 0}</td>
                        <td style="padding: 10px; text-align:right; font-weight:bold; color:#d4af37;">${totalCajaCalculado.toFixed(2)}€</td>
                        <td style="padding: 10px; text-align:right;">${(r.pagado_tpv || 0).toFixed(2)}€</td>
                        <td style="padding: 10px; text-align:right;">${(r.pagado_efectivo || 0).toFixed(2)}€</td>
                        <td style="padding: 10px; text-align:center;">${estadoBadge}</td>
                        <td style="padding: 10px; text-align:center;">
                            <button onclick="borrarRegistroCajaIndividual('${r.id}', '${fInvertida}')" style="background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid #ef4444; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold;">🗑️ Borrar</button>
                        </td>
                    </tr>
                `;
            });
        }

        tablaHTML += `
                        </tbody>
                    </table>
                </div>
            </div>
        `;

        modalHist.innerHTML = tablaHTML;
        document.body.appendChild(modalHist);
    }

    /* --- ACCIÓN: BORRAR REGISTRO INDIVIDUAL DE SUPABASE --- */
    async function borrarRegistroCajaIndividual(idCaja, fechaVisual) {
        if (!confirm(`⚠️ ¿Seguro que deseas eliminar la caja del día ${fechaVisual}?\nSe borrará permanentemente de la nube.`)) return;

        const { error } = await _supabase
            .from('cajas_diarias')
            .delete()
            .eq('id', idCaja);

        if (error) {
            alert("No se pudo eliminar el registro de Supabase: " + error.message);
            return;
        }

        const fila = document.getElementById(`fila-caja-${idCaja}`);
        if (fila) fila.remove();
        
        alert(`🗑️ Registro del ${fechaVisual} eliminado correctamente.`);
    }

    /* --- ACCIÓN: DESCARGAR LIBRO EN FORMATO EXCEL/CSV --- */
    async function descargarExcelUnificado() {
        const { data: registros, error } = await _supabase
            .from('cajas_diarias')
            .select('*')
            .order('fecha', { ascending: true });

        if(error || !registros) return;

        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "FECHA;ENTRADAS;COPAS;CERVEZAS;CHUPITOS;REFRESCOS;ENERGETICOS;TOTAL CAJA REAL;COBRADO TPV;EFECTIVO;DESCUADRE\n";

        registros.forEach(r => {
            const totalCaja = (parseFloat(r.pagado_efectivo) || 0) + (parseFloat(r.pagado_tpv) || 0);
            const chups = r.chupitos_vendidas || r.chupitos || 0;
            csvContent += `${r.fecha};${r.total_asistentes || 0};${r.copas_vendidas || 0};${r.cervezas_vendidas || 0};${chups};${r.refrescos_vendidas || 0};${r.energeticos_vendidas || 0};${totalCaja.toFixed(2)};${(r.pagado_tpv || 0).toFixed(2)};${(r.pagado_efectivo || 0).toFixed(2)};${(r.descuadre || 0).toFixed(2)}\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "LIBRO_DE_CAJAS_UNIFICADO.csv");
        document.body.appendChild(link);
        link.click();
        link.remove();
    }

    /* --- PANTALLA / MODAL DE CIERRE CIEGO PARA PUERTA --- */
    function abrirModalCierrePuertaCiego() {
        let modal = document.getElementById('modalCierrePuertaCiego');
        if (!modal) {
            modal = document.createElement('div');
            modal.id = 'modalCierrePuertaCiego';
            modal.style.cssText = "position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200000; display: flex; justify-content: center; align-items: center; font-family: 'Inter', sans-serif; color: #fff;";
            modal.innerHTML = `
                <div style="background: #111827; border: 1px solid #374151; border-radius: 12px; width: 90%; max-width: 400px; padding: 25px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);">
                    <h3 style="margin-top: 0; color: #ef4444; font-size: 18px; text-align: center;">🔴 Cierre Ciego - Puerta</h3>
                    <p style="font-size: 13px; color: #9ca3af; text-align: center; margin-bottom: 20px;">Introduce el recuento real de caja:</p>
                    
                    <label style="font-size: 12px; color: #d4af37; font-weight: bold; display: block; margin-bottom: 5px;">Efectivo contado (€):</label>
                    <input type="number" id="puertaCiegoEfectivo" value="0" step="0.01" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: #fff; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box;">
                    
                    <label style="font-size: 12px; color: #d4af37; font-weight: bold; display: block; margin-bottom: 5px;">TPV / Tarjeta (€):</label>
                    <input type="number" id="puertaCiegoTpv" value="0" step="0.01" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: #fff; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box;">
                    
                    <label style="font-size: 12px; color: #d4af37; font-weight: bold; display: block; margin-bottom: 5px;">Ropero (€) [Opcional]:</label>
                    <input type="number" id="puertaCiegoRopero" value="0" step="0.01" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: #fff; border-radius: 6px; margin-bottom: 20px; box-sizing: border-box;">
                    
                    <div style="display: flex; gap: 10px;">
                        <button type="button" onclick="ejecutarCierrePuertaCiegoReal()" style="flex: 1; background: #ef4444; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">Confirmar Cierre</button>
                        <button type="button" onclick="document.getElementById('modalCierrePuertaCiego').remove()" style="flex: 1; background: #374151; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">Cancelar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        } else {
            document.getElementById('puertaCiegoEfectivo').value = 0;
            document.getElementById('puertaCiegoTpv').value = 0;
            document.getElementById('puertaCiegoRopero').value = 0;
            modal.style.display = 'flex';
        }
    }

    async function ejecutarCierrePuertaCiegoReal() {
        if (!confirm("¿Estás seguro de efectuar el cierre de noche? Se registrarán los datos y se limpiarán los aforos activos.")) return;

        const efectivo = parseFloat(document.getElementById('puertaCiegoEfectivo').value) || 0;
        const tpv = parseFloat(document.getElementById('puertaCiegoTpv').value) || 0;
        const ropero = parseFloat(document.getElementById('puertaCiegoRopero').value) || 0;
        const totalEfectivoConRopero = efectivo + ropero;
        const totalRecaudado = totalEfectivoConRopero + tpv;

        const { error: errorCaja } = await _supabase
            .from('cajas_diarias')
            .insert([{ 
                fecha: new Date().toISOString().split('T')[0],
                pagado_efectivo: totalEfectivoConRopero, 
                pagado_tpv: tpv,
                recaudacion_esperada: totalRecaudado,
                total_asistentes: db.filter(s => s.dentro || s.hora).length
            }]);

        if (errorCaja) {
            alert("⚠️ Error al guardar en la nube: " + errorCaja.message);
            return;
        }

        const listaIds = db.map(socio => socio.id).filter(id => id != null);
        if (listaIds.length > 0) {
            await _supabase
                .from(NOMBRE_TABLA)
                .update({ dentro: false, hora: null, consumiciones: null, pago_realizado: false, hora_pago: null })
                .in('id', listaIds);
        }

        const modal = document.getElementById('modalCierrePuertaCiego');
        if (modal) modal.remove();

        if (typeof refrescarDatos === 'function') await refrescarDatos();
        alert("✅ Noche reiniciada y cerrada correctamente desde puerta.");
    }

    // [CONTROLADOR DEFINITIVO DEL BOTÓN ROJO DE REINICIAR NOCHE - PUERTA]
    function gestionarBotonCierreSegunRol() {
        const selectClaves = document.getElementById('tipoClave');
        let btnPuertaCiego = document.getElementById('btnResetPuerta');
        
        let esJefe = false;
        if (selectClaves) {
            const val = (selectClaves.value || "").toUpperCase();
            if (val.includes('JEFE')) {
                esJefe = true;
            }
        }

        if (esJefe) {
            if (btnPuertaCiego) btnPuertaCiego.style.display = 'none';
            return;
        }

        if (!btnPuertaCiego) {
            const btnCerrarSesion = document.getElementById('btnLogout');
            if (btnCerrarSesion && btnCerrarSesion.parentNode) {
                btnPuertaCiego = document.createElement('button');
                btnPuertaCiego.id = 'btnResetPuerta';
                btnPuertaCiego.type = 'button';
                btnPuertaCiego.innerText = "🔴 REINICIAR NOCHE";
                btnCerrarSesion.parentNode.insertBefore(btnPuertaCiego, btnCerrarSesion);
            }
        }

        if (btnPuertaCiego) {
            btnPuertaCiego.style.display = 'inline-block';
            btnPuertaCiego.style.backgroundColor = "rgba(239, 68, 68, 0.15)";
            btnPuertaCiego.style.color = "#ef4444";
            btnPuertaCiego.style.border = "1px solid #ef4444";
            btnPuertaCiego.style.padding = "8px 16px";
            btnPuertaCiego.style.borderRadius = "8px";
            btnPuertaCiego.style.fontWeight = "bold";
            btnPuertaCiego.style.fontSize = "12px";
            btnPuertaCiego.style.cursor = "pointer";
            btnPuertaCiego.style.marginRight = "12px";
            btnPuertaCiego.onclick = abrirModalCierrePuertaCiego;
        }
    }

    // Eventos del Lienzo Signature Canvas
    function obtenerPosicion(e) {
        if (!canvas) return { x: 0, y: 0 };
        const r = canvas.getBoundingClientRect();
        const clienteX = e.touches ? e.touches[0].clientX : e.clientX;
        const clienteY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clienteX - r.left, y: clienteY - r.top };
    }

    function iniciarDibujo(e) { dibujando = true; pautarDibujo(e); }
    function terminarDibujo() { dibujando = false; if(ctx) ctx.beginPath(); }
    function pautarDibujo(e) {
        if (!dibujando || !ctx) return;
        e.preventDefault();
        const pos = obtenerPosicion(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }

    if(canvas) {
        canvas.addEventListener('mousedown', iniciarDibujo);
        window.addEventListener('mouseup', terminarDibujo);
        canvas.addEventListener('mousemove', pautarDibujo);

        canvas.addEventListener('touchstart', iniciarDibujo);
        window.addEventListener('touchend', terminarDibujo);
        canvas.addEventListener('touchmove', pautarDibujo);
    }

    // Arranque inicial y bucles en segundo plano
    if(typeof refrescarDatos === 'function') refrescarDatos();
    
    gestionarBotonCierreSegunRol();

    setInterval(() => {
        if (typeof refrescarDatos === 'function' && document.getElementById('modalTarjeta')?.style.display !== 'flex' && document.getElementById('modalLibroCajas')?.style.display !== 'flex' && !document.getElementById('modalHistoricoCajas')) {
            refrescarDatos();
        }
        if (document.getElementById('modalLibroCajas') && document.getElementById('modalLibroCajas').style.display === 'flex') {
            inyectorBotonHistorialEnArqueo();
        }
        gestionarBotonCierreSegunRol();
    }, 1500);
    </script>
